{% extends 'base.html' %}
{% block content %}
<style>
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        background: #1e3a8a; /* Solid deep blue */
    }

    .login-box {
        background: #2563eb;
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        color: #e0f2ff;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        max-width: 400px;
        width: 90%;
    }

    .login-box h2 {
        font-size: 26px;
        color: #ffffff;
        margin-bottom: 20px;
    }

    .login-box form {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .login-box input[type="text"],
    .login-box input[type="password"] {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border: none;
        border-radius: 8px;
        outline: none;
        background: #dbeafe;
        color: #1e3a8a;
    }

    .login-box input::placeholder {
        color: #5c8df6;
    }

    .btn-glow {
        display: inline-block;
        padding: 12px 25px;
        font-size: 15px;
        background: #3b82f6;
        color: white;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
        margin-top: 10px;
        box-shadow: 0 0 12px rgba(59, 130, 246, 0.6);
        transition: all 0.3s ease;
        border: none;
        cursor: pointer;
    }

    .btn-glow:hover {
        background: #2563eb;
        box-shadow: 0 0 20px rgba(37, 99, 235, 0.9);
    }

    .login-box a {
        color: #ffffff;
        margin-top: 15px;
        display: block;
        text-decoration: underline;
    }
</style>

<div class="login-container">
    <div class="login-box">
        <h2>🔐 Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-glow">Login</button>
        </form>
        <a href="{% url 'register' %}">Don't have an account? Register here</a>
    </div>
</div>
{% endblock %}
